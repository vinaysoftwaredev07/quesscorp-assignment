apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hrms-postgres-pvc
  namespace: hrms-lite
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-postgres
  namespace: hrms-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hrms-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hrms-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: hrms-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hrms-postgres
  namespace: hrms-lite
spec:
  selector:
    app.kubernetes.io/name: hrms-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
