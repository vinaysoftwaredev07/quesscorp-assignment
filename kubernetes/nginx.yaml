apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-nginx
  namespace: hrms-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hrms-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hrms-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 5173
            - containerPort: 8001
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: hrms-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: hrms-nginx
  namespace: hrms-lite
spec:
  selector:
    app.kubernetes.io/name: hrms-nginx
  ports:
    - name: frontend
      port: 5173
      targetPort: 5173
    - name: backend
      port: 8001
      targetPort: 8001
  type: ClusterIP
