apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-backend
  namespace: hrms-lite
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hrms-backend
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hrms-backend
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: interview-asignments-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: hrms-backend-config
          env:
            - name: SUPERADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: hrms-secrets
                  key: SUPERADMIN_KEY
          command:
            - sh
            - -c
            - alembic upgrade head && gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hrms-backend
  namespace: hrms-lite
spec:
  selector:
    app.kubernetes.io/name: hrms-backend
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
