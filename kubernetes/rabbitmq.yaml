apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-rabbitmq
  namespace: hrms-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hrms-rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hrms-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: guest
            - name: RABBITMQ_DEFAULT_PASS
              value: guest
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hrms-rabbitmq
  namespace: hrms-lite
spec:
  selector:
    app.kubernetes.io/name: hrms-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  type: ClusterIP
